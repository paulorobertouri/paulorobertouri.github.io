name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f robots.txt
          test -f sitemap.xml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate HTML
        run: |
          npx --yes html-validate \
            --rule "void-style:off" \
            --rule "doctype-style:off" \
            --rule "long-title:off" \
            --rule "no-raw-characters:off" \
            index.html

      - name: Validate links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --verbose --no-progress --accept 200,206,429 index.html
